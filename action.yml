name: "Sync Issue Field"
description: "Sync GitHub parent issue's fields to child issue's fields."
author: "kudoas"
branding:
  color: green
  icon: shield
inputs:
  repository:
    description: "Repository name with owner. For example, kudoas/sync-issue-field. Default is the current repository."
    default: ${{ github.repository }}
  issue:
    description: "The number that identifies the issue. Specify the child issue you wish to synchronize with the parent issue. Default is the current issue."
    default: ${{ github.event.issue.number }}
  token:
    description: "GitHub Token"
    required: true
  sync-milestone:
    description: "Replace the child's milestone with the parent's milestone, including clearing it."
    default: 'false'
  sync-projects:
    description: "Add the child to the first project returned for its parent. Requires a Projects-capable GitHub App token or PAT."
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Download and run the release binary
      run: bash "$ACTION_PATH/scripts/run-action.sh"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPOSITORY: ${{ github.action_repository || github.repository }}
        ACTION_REF: ${{ github.action_ref }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_ISSUE: ${{ inputs.issue }}
        INPUT_SYNC_MILESTONE: ${{ inputs.sync-milestone }}
        INPUT_SYNC_PROJECTS: ${{ inputs.sync-projects }}
