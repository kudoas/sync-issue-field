name: Verify parent synchronization

on:
  push:
    branches: [fix/sub-issue-parent]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        relation: [sub-issue, checklist]
        milestone: ['true', 'false']
    env:
      LIVE_RELEASE_TEST: '1'
      SYNC_MILESTONE: ${{ matrix.milestone }}
      LIVE_SYNC_MILESTONE: ${{ matrix.milestone }}
      LIVE_RELATION: ${{ matrix.relation }}
      LIVE_REFERENCE: candidate
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build the exact candidate and Go verification harness
        run: |
          git rev-parse HEAD
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/candidate" ./cmd/run
          go test -c -o "$RUNNER_TEMP/live.test" ./tests
      - name: Create isolated test Issues
        id: fixture
        run: '"$RUNNER_TEMP/live.test" -test.run "^TestLiveIssueSync$" -test.v'
        env:
          LIVE_PHASE: setup
      - name: Run candidate against the test child
        run: '"$RUNNER_TEMP/candidate"'
        env:
          GITHUB_ISSUE: ${{ steps.fixture.outputs.child }}
      - name: Read back and assert synchronized fields
        if: always() && steps.fixture.outcome == 'success'
        run: '"$RUNNER_TEMP/live.test" -test.run "^TestLiveIssueSync$" -test.v'
        env:
          LIVE_PHASE: verify
      - name: Close test Issues and remove temporary resources
        if: always()
        run: '"$RUNNER_TEMP/live.test" -test.run "^TestLiveIssueSync$" -test.v'
        env:
          LIVE_PHASE: cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: parent-${{ matrix.relation }}-milestone-${{ matrix.milestone }}
          path: ${{ runner.temp }}/live-*.json
          if-no-files-found: ignore
