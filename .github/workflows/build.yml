name: Publish release binaries

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source-sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Draft releases may not have a Git tag yet.
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Check release source
        env:
          EXPECTED_SHA: ${{ inputs.source-sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          target="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
          test "$target" = "$EXPECTED_SHA"
          tagged="$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | awk 'NR == 1 { sha=$1 } /\^\{\}$/ { sha=$1 } END { print sha }')"
          if [[ -n "$tagged" ]]; then
            test "$tagged" = "$EXPECTED_SHA"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./...
      - name: Build release assets
        run: bash scripts/build-release.sh "$RUNNER_TEMP/release"
      - name: Test the packaged binaries and launcher
        run: go test ./tests -count=1 -v
        env:
          RELEASE_ASSET_DIR: ${{ runner.temp }}/release
      - name: Upload assets and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/publish-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/release"
