name: Publish release binaries

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source-sha:
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Check release source
        env:
          EXPECTED_SHA: ${{ inputs.source-sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$EXPECTED_SHA" ]]; then
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build release assets
        run: bash scripts/build-release.sh "$RUNNER_TEMP/release"
      - name: Test the packaged binaries and launcher
        run: go test ./tests -count=1 -v
        env:
          RELEASE_ASSET_DIR: ${{ runner.temp }}/release
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/publish-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/release"
