name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release version tag to publish missing assets for
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run release-please
        uses: google-github-actions/release-please-action@e4dc86ba9405554aeba3c6bb2d169500e7d3b4ee # v4
        id: release
        with:
          release-type: go
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: >-
      ${{ !cancelled() && !failure() &&
          (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      source-sha: ${{ needs.release-please.outputs.sha }}
    permissions:
      contents: write
